name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  python-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Basic import/smoke test
        run: |
          python -m pip show uuprotect
          python -c "import uuprotect; print('import ok')"

  electron-ui-build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: electron-ui
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: electron-ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build UI
        run: npm run build
